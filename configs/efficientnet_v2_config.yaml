# Configuration for MODEL D: EfficientNetV2-S (Trained from Scratch - Zero Pretraining)
model_name: "efficientnet_v2"
seed: 42

dataset:
  raw_dir: "data/archive"
  processed_dir: "data/processed"
  reports_dir: "reports"
  validation_split_ratio: 0.20

preprocessing:
  image_size: [224, 224]
  crop_brain_contour: true
  normalization_file: "reports/dataset_stats.json"

training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  scheduler: "cosine"
  early_stopping_patience: 6
  mixed_precision: true

hardware:
  device: "auto"
  num_workers: 0
  pin_memory: true
