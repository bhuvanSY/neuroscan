services:
  # ===========================================================================
  # 1. FastAPI Deep Learning & Triage Backend (Python 3.10)
  # ===========================================================================
  - type: web
    name: neuroscan-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements-render.txt"
    startCommand: "python -m uvicorn src.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production

  # ===========================================================================
  # 2. React Vite Clinical Frontend (Static Site)
  # ===========================================================================
  - type: web
    name: neuroscan-ai-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: neuroscan-ai-backend
          property: host
