services:
  # ===========================================================================
  # FastAPI Deep Learning & Triage Backend (Production Python 3.10)
  # ===========================================================================
  - type: web
    name: neuroscan-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements-render.txt"
    startCommand: "python -m uvicorn src.api.app:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
